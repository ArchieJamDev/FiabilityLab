---
name: measurementInvariance
title: Measurement Invariance
menuGroup: FiabilityLab
version: '1.0.0'
jas: '1.2'
options:

  - name: data
    type: Data

  - name: group
    title: Grouping variable
    type: Variable
    suggested:
      - nominal
      - ordinal
    permitted:
      - factor

  # Same Array/Group option + dynamic ListBox pattern as Advanced
  # Reliability's own "Add New Factor" list -- one confirmatory
  # measurement model, tested for invariance across the levels of the
  # grouping variable above.
  - name: factors
    title: Factors
    type: Array
    default:
      - label: Factor 1
        vars: []
    template:
      type: Group
      elements:
        - name: label
          type: String
        - name: vars
          type: Variables
          suggested:
            - continuous
            - ordinal
          permitted:
            - numeric

  - name: itemType
    title: Item type
    type: List
    options:
      - name: auto
        title: Auto-detect
      - name: continuous
        title: Continuous
      - name: ordinal
        title: Ordinal
    default: auto

  - name: estimator
    title: Estimator
    type: List
    options:
      - name: auto
        title: Auto (ML, or WLSMV if items are ordinal)
      - name: ml
        title: ML
      - name: mlr
        title: MLR (robust to non-normality)
      - name: wlsmv
        title: WLSMV (for ordinal items)
    default: auto

  - name: showPlots
    type: Bool
    default: true

  - name: plotStyle
    type: List
    options:
      - name: light
        title: Light
      - name: gray
        title: Gray (default)
      - name: linedraw
        title: Line Draw
      - name: greenred
        title: Green-Red
      - name: purpleorange
        title: Purple-Orange
      - name: bluegreen
        title: Blue-Green Light
    default: gray

  - name: reportLang
    type: List
    options:
      - name: en
        title: English
      - name: es
        title: Español
    default: en
...
