---
name: internalConsistency
title: Internal Consistency
menuGroup: FiabilityLab
version: '1.5.0'
jas: '1.2'
options:

  - name: data
    type: Data

  # ── Variables ────────────────────────────────────────────────────────────
  - name: items
    type: Variables
    suggested:
      - continuous
      - ordinal
    permitted:
      - numeric

  # ── Measurement level ─────────────────────────────────────────────────────
  - name: measureLevel
    title: Measurement level
    type: List
    options:
      - name: auto
        title: Auto-detect
      - name: dichotomous
        title: Dichotomous (0/1)
      - name: polytomous
        title: Polytomous (Likert / rating)
    default: auto
    description:
        ui: >
            Auto-detect inspects each item's unique values. Override when
            needed (e.g., 0/1 coded Likert vs. true dichotomous).
        R: >
            Auto-detect inspects each item's unique values. Override when
            needed (e.g., 0/1 coded Likert vs. true dichotomous).

  # ── Statistics — Polytomous ───────────────────────────────────────────────
  - name: alpha
    type: Bool
    default: true

  - name: ordinalAlpha
    type: Bool
    default: false

  - name: omega
    type: Bool
    default: true

  - name: omegaHierarchical
    type: Bool
    default: false

  - name: glb
    type: Bool
    default: false

  - name: splitHalf
    type: Bool
    default: false

  - name: guttman
    type: Bool
    default: false

  # ── Statistics — Dichotomous ──────────────────────────────────────────────
  - name: kr20
    type: Bool
    default: false
    description:
        ui: Only applicable to genuinely dichotomous (0/1) items.
        R: Only applicable to genuinely dichotomous (0/1) items.

  - name: kr21
    type: Bool
    default: false
    description:
        ui: Only applicable to genuinely dichotomous (0/1) items.
        R: Only applicable to genuinely dichotomous (0/1) items.

  # ── Item analysis ─────────────────────────────────────────────────────────
  - name: itemAnalysis
    type: Bool
    default: true

  # ── Normality ─────────────────────────────────────────────────────────────
  - name: normality
    type: Bool
    default: true

  # ── Bootstrap CIs ─────────────────────────────────────────────────────────
  - name: bootstrapCi
    title: Bootstrap confidence intervals (95%)
    type: Bool
    default: false

  - name: bootstrapSamples
    title: Bootstrap samples
    type: Integer
    default: 1000
    min: 100
    max: 10000

  # ── Dimensionality ────────────────────────────────────────────────────────
  - name: checkDimensionality
    type: Bool
    default: false
    description:
        ui: >
            If multiple dimensions are detected, consider computing
            Alpha/Omega per subscale and reporting Omega Hierarchical
            overall.
        R: >
            If multiple dimensions are detected, consider computing
            Alpha/Omega per subscale and reporting Omega Hierarchical
            overall.

  # ── Reliability assumptions (tau-equivalence, unidimensionality,
  # normality -- Cronbach's alpha's own core assumptions) ──────────────────
  - name: checkReliabilityAssumptions
    type: Bool
    default: false
    description:
        ui: >
            Tau-equivalence is tested via a CFA likelihood-ratio test
            (requires the lavaan package); unidimensionality and normality
            reuse the Dimensionality and Item Analysis checks above.
        R: >
            Tau-equivalence is tested via a CFA likelihood-ratio test
            (requires the lavaan package); unidimensionality and normality
            reuse the Dimensionality and Item Analysis checks above.

  # ── Plots ─────────────────────────────────────────────────────────────────
  - name: showPlots
    type: Bool
    default: false

  - name: plotItemDist
    type: Bool
    default: true

  - name: plotItemTotal
    type: Bool
    default: true

  - name: plotScree
    type: Bool
    default: false

  - name: reportLang
    type: List
    options:
      - name: en
        title: English
      - name: es
        title: Español
    default: en
...
