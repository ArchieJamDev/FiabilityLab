---
name: internalConsistency
title: Internal Consistency
jrs: '1.0'
items:

  - name: autoDetectNote
    type: Html
    title: Data Summary

  - name: sampleAdequacy
    type: Html
    title: Sample & Data Quality

  - name: mainTable
    type: Table
    title: Reliability Coefficients
    rows: 0
    columns:
      - name: coefficient
        title: Coefficient
        type: text
      - name: value
        title: Estimate
        type: number
        format: zto,digits=3
      - name: interpretation
        title: Interpretation
        type: text
      - name: applicability
        title: Conditions
        type: text

  - name: plotComparison
    type: Image
    title: Coefficient Comparison
    width: 600
    height: 350
    renderFun: .plotComparison

  - name: discordanceNote
    type: Html
    title: Coefficient Discordance

  - name: bootstrapTable
    type: Table
    title: Bootstrap Confidence Intervals (95%)
    visible: (bootstrapCi)
    rows: 0
    columns:
      - name: coefficient
        title: Coefficient
        type: text
      - name: estimate
        title: Estimate
        type: number
        format: zto,digits=3
      - name: ci_lower
        title: CI Lower
        type: number
        format: zto,digits=3
      - name: ci_upper
        title: CI Upper
        type: number
        format: zto,digits=3
      - name: se_boot
        title: Boot SE
        type: number
        format: zto,digits=3

  - name: reliabilityAssumptionsTable
    type: Table
    title: Reliability Assumptions Check
    visible: (alpha && checkReliabilityAssumptions)
    rows: 0
    columns:
      - name: assumption
        title: Assumption
        type: text
      - name: test
        title: Test
        type: text
      - name: statistic
        title: Statistic
        type: number
        format: zto,digits=3
      - name: df
        title: df
        type: text
      - name: p_value
        title: p
        type: number
        format: zto,digits=4
      - name: verdict
        title: Verdict
        type: text

  - name: reliabilityAssumptionsNote
    type: Html
    title: Reliability Assumptions — What It Means
    visible: (alpha && checkReliabilityAssumptions)

  - name: normalityTable
    type: Table
    title: Item Normality (Shapiro-Wilk)
    visible: (normality)
    rows: 0
    columns:
      - name: item
        title: Item
        type: text
      - name: W
        title: W
        type: number
        format: zto,digits=4
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: sig
        title: ''
        type: text
      - name: skewness
        title: Skewness
        type: number
        format: zto,digits=3
      - name: kurtosis
        title: Kurtosis
        type: number
        format: zto,digits=3
      - name: decision
        title: Decision
        type: text

  - name: dimensionalityNote
    type: Html
    title: Dimensionality Check
    visible: (checkDimensionality)

  - name: itemTable
    type: Table
    title: Item Analysis
    visible: (itemAnalysis)
    rows: 0
    columns:
      - name: item
        title: Item
        type: text
      - name: mean
        title: Mean
        type: number
        format: zto,digits=3
      - name: sd
        title: SD
        type: number
        format: zto,digits=3
      - name: skewness
        title: Skew
        type: number
        format: zto,digits=3
      - name: n_unique
        title: Options
        type: integer
      - name: citc
        title: r(item-total)
        type: number
        format: zto,digits=3
      - name: alpha_drop
        title: α if deleted
        type: number
        format: zto,digits=3
      - name: loading
        title: Factor load.
        type: number
        format: zto,digits=3

  - name: plotItemDist
    type: Image
    title: Item Score Distributions
    visible: (showPlots && plotItemDist)
    width: 900
    height: 500
    renderFun: .plotItemDist
    clearWith:
      - items
      - showPlots
      - plotItemDist

  - name: plotItemTotal
    type: Image
    title: Item–Total Correlations
    visible: (showPlots && plotItemTotal)
    width: 700
    height: 400
    renderFun: .plotItemTotal
    clearWith:
      - items
      - showPlots
      - plotItemTotal

  - name: plotScree
    type: Image
    title: Scree Plot (Parallel Analysis)
    visible: (showPlots && plotScree)
    width: 600
    height: 400
    renderFun: .plotScree
    clearWith:
      - items
      - showPlots
      - plotScree

  - name: interpretation
    type: Html
    title: Interpretation & Recommendations

  - name: advancedFitTable
    type: Table
    title: 'Advanced (SEM): Confirmatory Factor Model Fit'
    visible: (advancedEnable)
    rows: 0
    columns:
      - name: model
        title: Model
        type: text
      - name: chisq
        title: χ²
        type: number
        format: zto,digits=2
      - name: df
        title: df
        type: integer
      - name: pvalue
        title: p
        type: number
        format: zto,pvalue
      - name: cfi
        title: CFI
        type: number
        format: zto,digits=3
      - name: tli
        title: TLI
        type: number
        format: zto,digits=3
      - name: rmsea
        title: RMSEA
        type: number
        format: zto,digits=3
      - name: rmsea_ci
        title: RMSEA 90% CI
        type: text
      - name: srmr
        title: SRMR
        type: number
        format: zto,digits=3
      - name: verdict
        title: Fit
        type: text

  - name: advancedReliabilityTable
    type: Table
    title: 'Advanced (SEM): Reliability by Factor'
    visible: (advancedEnable)
    rows: 0
    columns:
      - name: factor
        title: Factor
        type: text
      - name: items
        title: Items
        type: integer
      - name: cr
        title: CR / ω
        type: number
        format: zto,digits=3
      - name: ave
        title: AVE
        type: number
        format: zto,digits=3
      - name: h
        title: H
        type: number
        format: zto,digits=3
      - name: interpretation
        title: Interpretation
        type: text

  - name: advancedHtmtTable
    type: Table
    title: 'Advanced (SEM): Discriminant Validity (HTMT)'
    visible: (advancedEnable)
    rows: 0
    columns:
      - name: factor_a
        title: Factor A
        type: text
      - name: factor_b
        title: Factor B
        type: text
      - name: htmt
        title: HTMT
        type: number
        format: zto,digits=3
      - name: verdict
        title: Verdict
        type: text

  - name: advancedOmegaHNote
    type: Html
    title: 'Advanced (SEM): Second-Order Omega Hierarchical'
    visible: (advancedEnable && secondOrder)

  - name: advancedInterpretation
    type: Html
    title: 'Advanced (SEM): Interpretation & Recommendations'
    visible: (advancedEnable)
...
