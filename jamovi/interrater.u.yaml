---
name: interRater
title: Inter-Rater Agreement
jus: '3.0'
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Ratings
        children:
          - type: VariablesListBox
            name: ratings
            isTarget: true
  - type: CollapseBox
    label: Coefficients
    collapsed: false
    children:
      - type: CheckBox
        name: kappa
        label: Cohen's / Fleiss' Kappa
      - type: CheckBox
        name: gwet
        label: Gwet's AC1 / AC2
      - type: CheckBox
        name: krippendorff
        label: Krippendorff's Alpha
      - type: CheckBox
        name: icc
        label: Intraclass Correlation (ICC)
      - type: CheckBox
        name: kendallW
        label: Kendall's W
  - type: CollapseBox
    label: Report Language
    collapsed: false
    children:
      - type: ComboBox
        name: reportLang
  - type: CollapseBox
    label: Data Type
    collapsed: true
    children:
      - type: ComboBox
        name: dataType
        label: Data Type
  - type: CollapseBox
    label: ICC Assumptions
    collapsed: true
    children:
      - type: CheckBox
        name: checkIccAssumptions
        label: ICC assumptions (normality, homoscedasticity, linearity)
        enable: (icc)
  - type: CollapseBox
    label: Bootstrap Confidence Intervals
    collapsed: true
    children:
      - type: CheckBox
        name: bootstrapCi
      - type: TextBox
        name: bootstrapSamples
        format: number
        enable: (bootstrapCi)
...
