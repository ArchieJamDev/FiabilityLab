name: advancedReliability
title: Advanced Reliability (SEM)
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: CollapseBox
    label: Report Language
    collapsed: false
    children:
      - type: ComboBox
        name: reportLang
  - type: Label
    label: >-
      Assign items to at least one factor below (3+ items per factor). A
      second-order general factor needs at least 3 first-order factors to be
      identified. Factor names are used as-is in tables and text.
  - type: CheckBox
    name: secondOrder
    label: Fit a second-order (hierarchical) general factor
  - type: CollapseBox
    label: Diagnostic Plot
    collapsed: true
    children:
      - type: CheckBox
        name: showPlots
        label: Show reliability comparison plot
      - type: ComboBox
        name: plotStyle
        label: Plot style
        enable: (showPlots)
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Factors
        children:
          - type: ListBox
            name: factors
            showColumnHeaders: false
            fullRowSelect: true
            stretchFactor: 1
            columns:
              - name: label
                stretchFactor: 1
                template:
                  type: TextBox
                  format: string
              - name: vars
                stretchFactor: 1
                template:
                  type: VariablesListBox
                  isTarget: true
