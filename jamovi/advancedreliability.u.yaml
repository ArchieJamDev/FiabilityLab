name: advancedReliability
title: Advanced Reliability (SEM)
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: CollapseBox
    label: Report Language
    collapsed: false
    children:
      - type: ComboBox
        name: reportLang
  - type: Label
    label: >-
      Assign items to at least one factor below (3+ items per factor). A
      second-order general factor needs at least 3 first-order factors to be
      identified. Factor names are used as-is in tables and text.
  - type: CheckBox
    name: secondOrder
    label: Fit a second-order (hierarchical) general factor
  - type: CollapseBox
    label: Diagnostic Plot
    collapsed: true
    children:
      - type: CheckBox
        name: showPlots
        label: Show reliability comparison plot
      - type: ComboBox
        name: plotStyle
        label: Plot style
        enable: (showPlots)
  - type: VariableSupplier
    persistentItems: true
    stretchFactor: 1
    suggested:
      - continuous
      - ordinal
    permitted:
      - numeric
    children:
      - type: TargetLayoutBox
        label: Factors
        children:
          - type: ListBox
            name: factors
            height: large
            addButton: Add New Factor
            template:
              type: LayoutBox
              margin: normal
              children:
                - type: TextBox
                  valueKey: [label]
                  borderless: true
                  name: blockName
                  stretchFactor: 1
                  margin: normal
                - type: VariablesListBox
                  valueFilter: unique
                  valueKey: [vars]
                  name: blockList
                  isTarget: true
                  height: auto
                  ghostText: drag variables here
