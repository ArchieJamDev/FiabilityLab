---
name: interRater
title: Inter-Rater Agreement
jrs: '1.0'
items:
  - name: autoDetectNote
    type: Html
    title: Data Summary

  - name: mainTable
    type: Table
    title: Agreement Coefficients
    rows: 0
    columns:
      - name: coefficient
        title: Coefficient
        type: text
      - name: value
        title: Value
        type: number
        format: zto,digits=3
      - name: interpretation
        title: Interpretation
        type: text
      - name: ci_lower
        title: CI Lower
        type: number
        format: zto,digits=3
      - name: ci_upper
        title: CI Upper
        type: number
        format: zto,digits=3
      - name: p_value
        title: p
        type: number
        format: zto,digits=4

  - name: plotComparison
    type: Image
    title: Coefficient Comparison
    width: 600
    height: 350
    renderFun: .plotComparison
    visible: (kappa || gwet || krippendorff || icc)

  - name: discordanceNote
    type: Html
    title: Coefficient Discordance

  - name: iccAssumptionsTable
    type: Table
    title: ICC Assumptions Check
    visible: (icc && checkIccAssumptions)
    rows: 0
    columns:
      - name: assumption
        title: Assumption
        type: text
      - name: test
        title: Test
        type: text
      - name: statistic
        title: Statistic
        type: number
        format: zto,digits=3
      - name: df
        title: df
        type: text
      - name: p_value
        title: p
        type: number
        format: zto,digits=4
      - name: verdict
        title: Verdict
        type: text

  - name: iccAssumptionsNote
    type: Html
    title: ICC Assumptions — What It Means
    visible: (icc && checkIccAssumptions)

  - name: plotDiagnostic
    type: Image
    title: Diagnostic Plot
    width: 600
    height: 350
    renderFun: .plotDiagnostic

  - name: interpretation
    type: Html
    title: Interpretation & Recommendations
...
