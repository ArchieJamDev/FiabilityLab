---
name: interRater
title: Inter-Rater Agreement
menuGroup: FiabilityLab
version: '1.0.0'
jas: '1.2'
options:
  - name: data
    type: Data

  - name: ratings
    type: Variables

  - name: dataType
    type: List
    options:
      - name: auto
        title: Auto-detect
      - name: nominal
        title: Nominal
      - name: ordinal
        title: Ordinal
      - name: continuous
        title: Continuous
    default: auto

  - name: kappa
    type: Bool
    default: true

  - name: gwet
    type: Bool
    default: true

  - name: krippendorff
    type: Bool
    default: true

  - name: icc
    type: Bool
    default: true

  - name: kendallW
    type: Bool
    default: false

  - name: bootstrapCi
    type: Bool
    default: true

  - name: bootstrapSamples
    type: Integer
    default: 1000
    min: 100
    max: 10000

  - name: reportLang
    type: List
    options:
      - name: en
        title: English
      - name: es
        title: Español
...
